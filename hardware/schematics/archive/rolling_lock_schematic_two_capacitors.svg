<text class="ts" x="72" y="920" dominant-baseline="central">9V, 5V and 3.3V power</text>
<path d="M270 920H294" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text class="ts" x="302" y="920" dominant-baseline="central">Battery side and signals</text>
<path d="M490 920H514" fill="none" stroke="#888780" stroke-width="1.5"/>
<text class="ts" x="522" y="920" dominant-baseline="central">Ground</text>
<text class="ts" x="40" y="946" dominant-baseline="central">All grounds are one net. Set the boost to 9V before the lock is connected.</text>
<text class="ts" x="40" y="962" dominant-baseline="central">Two 470 µF capacitors: one at the boost input, one at the ESP32 VIN pin.</text>
<text class="ts" x="40" y="978" dominant-baseline="central">The cells sit in the UPS module's own holder, so there is no separate battery fuse.</text>
